[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "octop-memory-harness"
version = "0.1.0"
description = "Client-side installer for octop-memory: hooks + MCP entries for Claude Code, Codex, Cursor, Kiro and the DSH native plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OctopMemory contributors" }]
keywords = ["octop-memory", "mcp", "claude-code", "codex", "cursor", "kiro", "dsh", "harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["octop-memory>=0.9.2"]

[project.scripts]
octop-memory-harness = "octopmemory_harness.cli:main"

[project.urls]
Homepage = "https://github.com/TencentCloud/octop-memory"
Repository = "https://github.com/TencentCloud/octop-memory"
Issues = "https://github.com/TencentCloud/octop-memory/issues"

[tool.hatch.build.targets.wheel]
packages = ["octopmemory_harness"]

[tool.hatch.build.targets.sdist]
include = ["octopmemory_harness", "pyproject.toml", "README.md"]
